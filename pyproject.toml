[project]
name = "sequentialhypothesistestingmodel"
version = "0.1.0"
description = ""
authors = [
    {name = "=",email = "mierowir@rose-hulman.edu"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mkdocs-redirects (>=1.2.3,<2.0.0)",
    "mkdocs-minify-plugin (>=0.8.0,<0.9.0)",
    "mkdocs-git-revision-date-localized-plugin (>=1.5.1,<2.0.0)",
    "mkdocs-awesome-nav (>=3.3.0,<4.0.0)",
    "mkdocs-macros-plugin (>=1.5.0,<2.0.0)",
    "mkdocs-material (>=9.7.6,<10.0.0)",
    "pytest (>=9.0.3,<10.0.0)",
    "matplotlib (>=3.10.9,<4.0.0)",
    "numpy (<2.4)",
    "pandas (<3.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
[dependency-groups]
dev = [
    "ipykernel (>=7.2.0,<8.0.0)"
]
